<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentFlow OS — Initializing Portal</title>
  <style>
    :root {
      --bg: #05070c;
      --card-border: #1e293b;
      --primary: #10b981;
      --accent: #3b82f6;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Portal Loader Graphics */
    .loader-ring {
      width: 70px;
      height: 70px;
      border: 3px solid var(--card-border);
      border-top: 3px solid var(--primary);
      border-right: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin { 
      100% { transform: rotate(360deg); } 
    }

    .boot-text {
      font-size: 0.95rem;
      letter-spacing: 2px;
      color: var(--primary);
      font-family: monospace;
      margin-bottom: 8px;
    }

    .boot-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="loader-ring"></div>
  <div class="boot-text">INITIALIZING SYSTEM PORTAL</div>
  <div class="boot-sub" id="bootProgress">Connecting to host environment...</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const bootProgress = document.getElementById('bootProgress');

      const steps = [
        'Checking static assets...',
        'Routing to core interface...',
        'Redirecting now...'
      ];

      let stepIdx = 0;
      const interval = setInterval(() => {
        if (stepIdx < steps.length) {
          bootProgress.textContent = steps[stepIdx];
          stepIdx++;
        } else {
          clearInterval(interval);
          // Redirect directly to frontend/index.html
          window.location.href = 'frontend/index.html';
        }
      }, 400);
    });
  </script>
</body>
</html>
